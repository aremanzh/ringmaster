<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ringmaster</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="app.css">
<script>
// Apply a saved theme before the first paint. Without one the page follows
// the system setting.
try {
  var saved = localStorage.getItem("ringmaster-theme");
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
} catch (e) { /* storage unavailable: follow the system */ }
</script>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" width="44" height="44" role="img" aria-label="Ringmaster">
        <circle class="mark-ring" cx="32" cy="32" r="20" fill="none" stroke-width="6"/>
        <circle class="mark-top" cx="32" cy="12" r="7"/>
        <circle class="mark-node" cx="14.68" cy="42" r="7"/>
        <circle class="mark-node" cx="49.32" cy="42" r="7"/>
      </svg>
      <div class="brand-text">
        <h1>Ringmaster</h1>
        <p id="summary" class="summary" role="status" aria-live="polite"></p>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="btn tile mono wide-only" data-act="php" id="phpchip">PHP</button>
      <button type="button" class="btn tile" data-act="start-all">Start all</button>
      <button type="button" class="btn tile" data-act="stop-all">Stop all</button>
      <button type="button" class="btn strong wide-only" data-act="add">+ Add project</button>
      <button type="button" class="btn tile icon" data-act="theme" aria-label="Switch between light and dark">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      </button>
      <span id="conn" class="conn" role="status" title="connecting"></span>
    </div>
  </header>

  <main class="layout" id="layout">
    <section class="board" id="board" aria-label="Projects"></section>
    <aside class="logpanel" id="logpanel" aria-label="Log" hidden></aside>
  </main>

  <nav class="bottomnav" aria-label="Sections">
    <button type="button" data-act="home" id="nav-home" aria-current="page">Projects</button>
    <button type="button" data-act="php" id="nav-php">PHP</button>
    <button type="button" data-act="add" id="nav-add">+ Add</button>
  </nav>
</div>

<div class="backdrop" id="backdrop" data-act="close-sheet" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="backend.js"></script>
<script src="app.js"></script>
</body>
</html>
