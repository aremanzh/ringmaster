name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ld = "-s -w -X main.version=$env:VERSION"
          go build -ldflags $ld -o dist/byob.exe ./cmd/byob
          go build -tags gui,desktop,production -ldflags "$ld -H windowsgui" -o dist/byob-gui.exe ./cmd/byob-gui
          & dist/byob.exe -version

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          Copy-Item byob.example.yaml, README.md, LICENSE dist/
          $zip = "byob_${env:VERSION}_windows_amd64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so `sha256sum -c` works on any platform.
          [IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash  $zip`n")

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          $zip = "byob_${env:VERSION}_windows_amd64.zip"
          gh release create $env:VERSION $zip "$zip.sha256" --title $env:VERSION --generate-notes
