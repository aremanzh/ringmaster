name: release

# Two ways to release:
#   - push a v* tag, or
#   - run this workflow by hand from the Actions tab on main with a version.
#     It then creates the tag itself, after the tests and the build passed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.3 (needs its entry in CHANGELOG.md)"
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A typed version gets the checks a pushed tag does not need.
      - name: Check version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run the release from main, not from $GITHUB_REF_NAME"
            exit 1
          fi
          if ! grep -q "^## ${VERSION#v} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${VERSION#v}' entry"
            exit 1
          fi
          # For an annotated tag the last line is the commit it points at.
          existing="$(git ls-remote --tags origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" | tail -n 1 | cut -f1)"
          if [ -z "$existing" ]; then
            echo "CREATE_TAG=true" >> "$GITHUB_ENV"
          elif [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::tag $VERSION already exists on $existing, not on this commit ($GITHUB_SHA)"
            exit 1
          else
            echo "tag $VERSION is already on this commit; reusing it"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        shell: pwsh
        run: |
          # Re-stamp the icon resources with this release's version.
          $winres = @('run', 'github.com/tc-hib/go-winres@v0.3.3', 'simply', '--arch', 'amd64', '--manifest', 'none',
            '--icon', 'assets/icon/ringmaster.ico', '--product-name', 'Ringmaster',
            '--product-version', $env:VERSION, '--file-version', $env:VERSION)
          go @winres --file-description 'Ringmaster CLI' --original-filename ringmaster.exe --out cmd/ringmaster/rsrc
          go @winres --file-description 'Ringmaster desktop app' --original-filename ringmaster-gui.exe --out cmd/ringmaster-gui/rsrc
          $ld = "-s -w -X main.version=$env:VERSION"
          go build -ldflags $ld -o dist/ringmaster.exe ./cmd/ringmaster
          go build -tags gui,desktop,production -ldflags "$ld -H windowsgui" -o dist/ringmaster-gui.exe ./cmd/ringmaster-gui
          & dist/ringmaster.exe -version

      - name: Package
        shell: pwsh
        run: |
          Copy-Item ringmaster.example.yaml, README.md, LICENSE dist/
          $zip = "ringmaster_${env:VERSION}_windows_amd64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so `sha256sum -c` works on any platform.
          [IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash  $zip`n")

      # Manual run only, and only once everything above passed, so a failed
      # build never leaves a tag behind. An annotated tag, like the pushed ones.
      - name: Tag
        if: env.CREATE_TAG == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "ringmaster_${env:VERSION}_windows_amd64.zip"
          gh release create $env:VERSION $zip "$zip.sha256" --title $env:VERSION --generate-notes
